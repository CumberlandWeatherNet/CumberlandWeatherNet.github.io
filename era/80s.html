<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CWN — 1980s Weather</title>

<link rel="stylesheet" href="80s.css">
<script type="module" src="core/cwn-heart-full.js"></script>

</head>
<body>

<div id="scaleWrapper">

    <!-- STATUS MESSAGE (if no city selected) -->
    <div id="status"></div>

    <!-- 1980s HEADER -->
    <div class="header80s">
        <div class="logoBox">
            <span class="logoText">CUMBERLAND WEATHER NETWORK</span>
        </div>
        <div class="eraTag">1980s Edition</div>
    </div>

    <!-- MAIN CRT PANEL -->
    <div class="crtPanel">

        <div class="cityName" id="cityName"></div>

        <div class="tempBox">
            <span id="tempValue"></span>
        </div>

        <div class="descBox" id="descValue"></div>

        <div class="windBox">
            <span id="windValue"></span>
        </div>

        <div class="dayPeriodBox" id="dayPeriod"></div>

        <div class="radarBox">
            <img id="radarImage" alt="Radar">
        </div>

        <div class="clockBox" id="clockValue"></div>

    </div>

</div>

<script src="80s.js" type="module"></script>

</body>
</html>
