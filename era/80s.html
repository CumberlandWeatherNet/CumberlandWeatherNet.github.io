<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CWN — 1980s Edition</title>

<style>
/* ============================================================
   1980s CARD LAYOUT — MATCHES HOMEPAGE STRUCTURE
   ============================================================ */

body {
    margin: 0;
    padding: 0;
    background: #2f241c; /* darker matte brown */
    font-family: "Courier New", monospace;
    color: #f2d28b;
}

/* Top navigation bar */
#navBar {
    width: 100%;
    background: #3b2a1f;
    padding: 15px 30px;
    box-sizing: border-box;
    border-bottom: 4px solid #d9a441;
    display: flex;
    gap: 30px;
    font-size: 22px;
}

#navBar a {
    color: #f2d28b;
    text-decoration: none;
    font-weight: bold;
}

#navBar a:hover {
    color: #e8d49a;
}

/* Card container */
#cardWrapper {
    max-width: 900px;
    margin: 40px auto;
    background: #3b2a1f;
    border: 6px solid #d9a441;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 0 40px rgba(0,0,0,0.4);
}

/* Header */
#cardWrapper h1 {
    text-align: center;
    font-size: 42px;
    margin: 0;
    color: #f7e7c1;
}

#cardWrapper h2 {
    text-align: center;
    font-size: 28px;
    margin-top: 10px;
    margin-bottom: 25px;
    color: #e8d49a;
}

/* City selector */
#citySelect {
    width: 100%;
    font-size: 22px;
    padding: 12px;
    margin-bottom: 25px;
    background: #2e2218;
    color: #f2d28b;
    border: 3px solid #d9a441;
    border-radius: 8px;
}

/* Conditions block */
#conditions {
    font-size: 26px;
    line-height: 1.4;
    margin-bottom: 30px;
}

.dataField {
    margin: 10px 0;
}

/* Radar frame */
#radarBox {
    width: 100%;
    height: 400px;
    border: 5px solid #d9a441;
    border-radius: 10px;
    background: black;
    overflow: hidden;
    margin-bottom: 25px;
}

#radarImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Alerts */
#alerts {
    font-size: 24px;
    color: #c44a4a;
    text-align: center;
    margin-bottom: 20px;
}

/* Timestamp */
#timestamp {
    text-align: center;
    font-size: 20px;
    color: #e8d49a;
}

/* Autoscale wrapper */
#scaleWrapper {
    transform-origin: top center;
}
</style>

</head>

<body>

<!-- DIRECTORY BAR -->
<div id="navBar">
    <a href="https://cumberlandweather.net">🏠 Home</a>
    <a href="https://cumberlandweather.net/era/1994Severe.html">⚡ 1994 Severe</a>
    <a href="https://cumberlandweather.net/era/80s.html">📺 1980s Edition</a>
</div>

<!-- AUTOSCALE WRAPPER -->
<div id="scaleWrapper">

    <!-- CARD -->
    <div id="cardWrapper">

        <h1>CUMBERLAND WEATHER NETWORK</h1>
        <h2>1980s Edition</h2>

        <!-- CITY SELECTOR -->
        <select id="citySelect">
            <option value="">Select a City</option>
        </select>

        <!-- CONDITIONS -->
        <div id="conditions">
            <div id="cityName" class="dataField"></div>
            <div id="tempValue" class="dataField"></div>
            <div id="descValue" class="dataField"></div>
            <div id="windValue" class="dataField"></div>
            <div id="dayPeriod" class="dataField"></div>
            <div id="clockValue" class="dataField"></div>
        </div>

        <!-- RADAR -->
        <div id="radarBox">
            <img id="radarImage" src="" alt="Radar">
        </div>

        <!-- ALERTS -->
        <div id="alerts"></div>

        <!-- TIMESTAMP -->
        <div id="timestamp"></div>

    </div>
</div>

<!-- HEART + ERA JS -->
<script type="module" src="../core/cwn-heart-full.js"></script>
<script type="module" src="80s.js"></script>

<!-- CITY SELECTOR LOGIC -->
<script>
fetch("/api/cities.json")
    .then(r => r.json())
    .then(data => {
        const dropdown = document.getElementById("citySelect");

        for (const county in data) {
            for (const city in data[county]) {
                const opt = document.createElement("option");
                opt.value = city;
                opt.textContent = `${city} (${county})`;
                dropdown.appendChild(opt);
            }
        }

        dropdown.addEventListener("change", () => {
            localStorage.setItem("cwn_city", dropdown.value);
            location.reload();
        });
    });
</script>

<script>
function autoscale() {
    const w = window.innerWidth / 900;
    const scale = Math.min(w, 1);
    document.getElementById("scaleWrapper").style.transform = `scale(${scale})`;
}
window.addEventListener("resize", autoscale);
autoscale();
</script>

</body>
</html>
