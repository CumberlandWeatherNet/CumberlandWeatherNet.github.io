<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cumberland Weather Network — 1970s Test Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#3b2a1f;
  font-family:"Georgia", serif;
  color:#f7e7c1;
  padding:20px;
}

/* 70s Frame */
.cwn-frame{
  max-width:900px;
  margin:0 auto;
  border:8px solid #a67c52;
  background:#4a372b;
  padding:20px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

/* Header */
.cwn-header{
  text-align:center;
  padding-bottom:20px;
  border-bottom:4px solid #a67c52;
}
.cwn-title{
  font-size:2rem;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:#f7e7c1;
}
.cwn-time{
  margin-top:6px;
  font-size:1.1rem;
}

/* City Selector */
.cwn-city-select{
  margin-top:20px;
  width:100%;
  padding:10px;
  background:#3b2a1f;
  border:3px solid #a67c52;
  color:#f7e7c1;
  font-size:1rem;
}

/* Forecast Box */
.cwn-forecast-box{
  margin-top:20px;
  padding:20px;
  background:#5a4335;
  border:4px solid #a67c52;
}
.cwn-forecast-title{
  font-size:1.2rem;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:0.1em;
}
.cwn-forecast-item{
  margin:8px 0;
  font-size:1rem;
}

/* Radar Box */
.cwn-radar-box{
  margin-top:20px;
  padding:20px;
  background:#5a4335;
  border:4px solid #a67c52;
}
.cwn-radar-title{
  font-size:1.2rem;
  margin-bottom:10px;
  text-transform:uppercase;
  letter-spacing:0.1em;
}
.cwn-radar-img{
  width:100%;
  border:3px solid #a67c52;
}
</style>
</head>

<body>
<div class="cwn-frame">

  <div class="cwn-header">
    <div class="cwn-title">Cumberland Weather Network</div>
    <div class="cwn-time" id="cwnTime">--:--</div>
  </div>

  <select id="cwnCitySelect" class="cwn-city-select">
    <option value="Lebanon,TN">Lebanon, TN</option>
    <option value="Nashville,TN">Nashville, TN</option>
    <option value="Gallatin,TN">Gallatin, TN</option>
    <option value="Cookeville,TN">Cookeville, TN</option>
    <option value="Murfreesboro,TN">Murfreesboro, TN</option>
  </select>

  <div class="cwn-forecast-box">
    <div class="cwn-forecast-title">Current Conditions</div>
    <div class="cwn-forecast-item" id="cwnTemp">Temperature: --°F</div>
    <div class="cwn-forecast-item" id="cwnWind">Wind: -- mph</div>
    <div class="cwn-forecast-item" id="cwnDesc">Conditions: --</div>
  </div>

  <div class="cwn-radar-box">
    <div class="cwn-radar-title">Regional Radar</div>
    <img id="cwnRadar" class="cwn-radar-img" src="" alt="Radar">
  </div>

</div>

<script>
/* TIME (NO SECONDS) */
function updateTime(){
  const now=new Date();
  document.getElementById("cwnTime").textContent=
    now.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
}
setInterval(updateTime,1000);
updateTime();

/* CITY COORDS */
const CITY_COORDS={
  "Lebanon,TN":{lat:36.2081,lon:-86.2911},
  "Nashville,TN":{lat:36.1627,lon:-86.7816},
  "Gallatin,TN":{lat:36.3884,lon:-86.4467},
  "Cookeville,TN":{lat:36.1628,lon:-85.5016},
  "Murfreesboro,TN":{lat:35.8456,lon:-86.3903}
};

/* LIVE WEATHER (Open-Meteo) */
async function fetchWeather(cityKey){
  const c=CITY_COORDS[cityKey];
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current_weather=true`;

  try{
    const res=await fetch(url);
    const data=await res.json();
    const cw=data.current_weather;

    const tempF = Math.round((cw.temperature * 9/5) + 32);

    document.getElementById("cwnTemp").textContent=`Temperature: ${tempF}°F`;
    document.getElementById("cwnWind").textContent=`Wind: ${Math.round(cw.windspeed)} mph`;
    document.getElementById("cwnDesc").textContent=`Conditions: Live`;
  }catch(e){
    document.getElementById("cwnDesc").textContent="Conditions: Unavailable";
  }
}

/* LIVE RADAR (NOAA static tile) */
function updateRadar(){
  const url="https://radar.weather.gov/ridge/standard/KOHX_loop.gif";
  document.getElementById("cwnRadar").src=url+"?t="+Date.now();
}

/* CITY CHANGE */
document.getElementById("cwnCitySelect").addEventListener("change",e=>{
  fetchWeather(e.target.value);
});

/* INITIAL LOAD */
fetchWeather("Lebanon,TN");
updateRadar();
setInterval(updateRadar,300000); // refresh every 5 min
</script>

</body>
</html>
