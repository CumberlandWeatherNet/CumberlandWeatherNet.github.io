<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cumberland Weather Network — Live</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        background: #0a0a0a;
        font-family: Arial, sans-serif;
        color: #e6e6e6;
        overflow: hidden;
    }

    #scaleWrapper {
        width: 1920px;
        height: 1080px;
        background: #111;
        border: 4px solid #222;
        transform-origin: top left;
        position: absolute;
        left: 50%;
        top: 50%;
    }

    #directoryBar {
        background: #001a33;
        padding: 10px 20px;
        font-size: 28px;
        border-bottom: 4px solid #003366;
    }
    #directoryBar a {
        color: #9fd3ff;
        text-decoration: none;
        margin-right: 40px;
    }

    #header {
        background: linear-gradient(#003366, #001a33);
        padding: 20px;
        text-align: center;
        color: #9fd3ff;
        font-size: 48px;
        font-weight: bold;
        border-bottom: 4px solid #004080;
    }

    #citySelectBox {
        margin: 20px;
        font-size: 28px;
    }
    #citySelect {
        font-size: 26px;
        padding: 6px 10px;
        background: #120000;
        color: #FFCC99;
        border: 2px solid #FFCC00;
    }

    #currentBox {
        background: #1a1a1a;
        padding: 20px;
        margin: 20px;
        border: 3px solid #333;
        font-size: 32px;
        min-height: 200px;
    }

    #weatherWindow {
        background: #000;
        border: 3px solid #444;
        margin: 20px;
        padding: 20px;
        height: 300px;
        font-size: 28px;
    }

    #forecastGrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
        margin: 20px;
    }

    .forecastDay {
        background: #1c1c1c;
        border: 3px solid #333;
        padding: 15px;
        text-align: center;
        font-size: 24px;
    }

    #alertBanner {
        background: #660000;
        color: #ffcccc;
        padding: 15px;
        text-align: center;
        font-size: 32px;
        border-top: 4px solid #990000;
        border-bottom: 4px solid #990000;
        margin-top: 20px;
    }

    #ticker {
        background: #002244;
        color: #cce6ff;
        padding: 10px;
        font-size: 24px;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
    }

    #ticker span {
        display: inline-block;
        padding-left: 100%;
        animation: scroll 18s linear infinite;
    }

    @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }
</style>
</head>

<body>

<div id="scaleWrapper">

    <div id="directoryBar">
        <a href="/80s.html">80s Edition</a>
        <a href="/1994Severe.html">1994 Severe Edition</a>
    </div>

    <div id="header">
        CUMBERLAND WEATHER NETWORK — LIVE DATA
    </div>

    <div id="alertBanner">
        ⚠️ LIVE WEATHER — CWN BACKEND ⚠️
    </div>

    <div id="citySelectBox">
        <label>Select City: </label>
        <select id="citySelect">
            <option value="">Choose a City</option>
            <option value="Lebanon">Lebanon</option>
            <option value="Nashville">Nashville</option>
            <option value="Gallatin">Gallatin</option>
            <option value="Hendersonville">Hendersonville</option>
            <option value="Murfreesboro">Murfreesboro</option>
            <option value="Franklin">Franklin</option>
            <option value="Columbia">Columbia</option>
            <option value="Cookeville">Cookeville</option>
            <option value="Clarksville">Clarksville</option>
            <option value="Springfield">Springfield</option>
            <option value="Dickson">Dickson</option>
            <option value="Shelbyville">Shelbyville</option>
            <option value="Manchester">Manchester</option>
            <option value="Tullahoma">Tullahoma</option>
            <option value="McMinnville">McMinnville</option>
            <option value="Sparta">Sparta</option>
            <option value="Carthage">Carthage</option>
            <option value="Lafayette">Lafayette</option>
            <option value="Hartsville">Hartsville</option>
            <option value="Livingston">Livingston</option>
            <option value="Jamestown">Jamestown</option>
            <option value="Crossville">Crossville</option>
        </select>
    </div>

    <div id="currentBox">
        Select a city to view current conditions.
    </div>

    <div id="weatherWindow">
        WEATHER WINDOW<br><br>
        Radar Placeholder<br>
        (Insert radar image or animation here)
    </div>

    <div id="forecastGrid"></div>

    <div id="ticker">
        <span>Live data provided by CWN Backend — Update weather.json to change output</span>
    </div>

</div>

<script>
    const BACKEND_URL = "https://raw.githubusercontent.com/CumberlandWeatherNet/CumberlandWeatherNet.github.io/main/api/weather.json";

    const currentBox = document.getElementById("currentBox");
    const forecastGrid = document.getElementById("forecastGrid");
    const citySelect = document.getElementById("citySelect");
    const scaleWrapper = document.getElementById("scaleWrapper");

    function resizeCanvas() {
        const baseW = 1920;
        const baseH = 1080;
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const scale = Math.min(winW / baseW, winH / baseH);

        scaleWrapper.style.transform = `scale(${scale})`;
        scaleWrapper.style.left = `${(winW - baseW * scale) / 2}px`;
        scaleWrapper.style.top = `${(winH - baseH * scale) / 2}px`;
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("load", resizeCanvas);

    async function loadWeather(city) {
        try {
            const res = await fetch(BACKEND_URL);
            const data = await res.json();

            const w = data[city];

            if (!w) {
                currentBox.innerHTML = `
                    <strong>${city}, TN</strong><br>
                    Temperature: <br>
                    Conditions: <br>
                    Humidity: <br>
                    Wind:
                `;
                forecastGrid.innerHTML = "";
                return;
            }

            currentBox.innerHTML = `
                <strong>${city}, TN</strong><br>
                Temperature: ${w.temp || ""}°F<br>
                Conditions: ${w.cond || ""}<br>
                Humidity: ${w.humidity || ""}%<br>
                Wind: ${w.wind || ""}
            `;

            if (w.forecast && Array.isArray(w.forecast)) {
                forecastGrid.innerHTML = w.forecast.map(p => `
                    <div class="forecastDay">
                        ${p.day || ""}<br>
                        ${p.temp || ""}°F<br>
                        ${p.cond || ""}
                    </div>
                `).join("");
            } else {
                forecastGrid.innerHTML = "";
            }

        } catch (err) {
            currentBox.innerHTML = "Error loading live data.";
            forecastGrid.innerHTML = "";
        }
    }

    citySelect.addEventListener("change", function() {
        const city = this.value;
        if (!city) {
            currentBox.innerHTML = "Select a city to view current conditions.";
            forecastGrid.innerHTML = "";
            localStorage.removeItem("cwnCity");
            return;
        }
        localStorage.setItem("cwnCity", city);
        loadWeather(city);
    });

    const savedCity = localStorage.getItem("cwnCity");
    if (savedCity) {
        citySelect.value = savedCity;
        loadWeather(savedCity);
    }
</script>

</body>
</html>
